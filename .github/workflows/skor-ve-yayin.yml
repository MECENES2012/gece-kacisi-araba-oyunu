name: Skor tablosu ve yayın
on:
  push:
    branches: [main]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
jobs:
  tablo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yorumlardan tabloyu kur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          repo = os.environ['REPO']
          tok = os.environ['GH_TOKEN']
          H = {'Authorization': 'Bearer '+tok, 'Accept': 'application/vnd.github+json', 'User-Agent': 'skor-botu'}
          def api(url):
              req = urllib.request.Request(url, headers=H)
              return json.loads(urllib.request.urlopen(req, timeout=30).read())
          kayitlar = []
          sayfa = 1
          while True:
              veri = api(f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100&page={sayfa}')
              if not veri: break
              for y in veri:
                  try:
                      k = json.loads(y.get('body') or '')
                      if isinstance(k, dict) and k.get('oyun')=='gece-kacisi' and k.get('isim') and int(k.get('puan',0))>0:
                          kayitlar.append({'isim': str(k['isim'])[:16], 'puan': int(k['puan']), 'mesafe': int(k.get('mesafe',0))})
                  except Exception:
                      pass
              if len(veri) < 100: break
              sayfa += 1
          en = {}
          for k in kayitlar:
              a = k['isim'].lower()
              if a not in en or k['puan'] > en[a]['puan']: en[a] = k
          tablo = sorted(en.values(), key=lambda x: -x['puan'])[:100]
          open('skorlar.json','w',encoding='utf-8').write(json.dumps({'skorlar': tablo, 'toplam': len(tablo)}, ensure_ascii=False))
          print('tablo:', len(tablo))
          EOF
      - name: Değişikliği kaydet
        run: |
          git config user.name "skor-botu"
          git config user.email "skor-botu@users.noreply.github.com"
          git add skorlar.json || true
          git diff --cached --quiet || (git commit -m "skor tablosu güncellendi" && git push)
      - name: Pages kur
        uses: actions/configure-pages@v5
      - name: Siteyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  dagit:
    needs: tablo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - id: dagitim
        uses: actions/deploy-pages@v4
